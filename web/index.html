<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goddess Anti-Cheat Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <h2>GODDESS AC</h2>
            <ul>
                <li class="active">Dashboard</li>
                <li>Players</li>
                <li>Resources</li>
                <li>Detections</li>
                <li>Bans</li>
            </ul>
        </div>
        <div class="main-content">
            <header>
                <h1>System Security Overview</h1>
                <button id="close-btn">X</button>
            </header>
            <div class="cards">
                <div class="card"><h3>Status</h3><p id="ac-status">ACTIVE</p></div>
                <div class="card"><h3>Total Bans</h3><p id="ban-count">0</p></div>
                <div class="card"><h3>Protected Resources</h3><p id="protected-count">0</p></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
